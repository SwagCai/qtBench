[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qtbench"
version = "1.0.0"
description = "Benchmark infrastructure for q,t-combinatorics statistic and bijection discovery tasks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
generation = ["numpy>=1.26", "networkx>=3.4"]
ai-judge-openai = ["openai>=2,<3"]
ai-judge-anthropic = ["anthropic>=0.117,<1"]
ai-judge-google = ["google-genai>=2.14,<3"]
ai-judge = [
    "openai>=2,<3",
    "anthropic>=0.117,<1",
    "google-genai>=2.14,<3",
]
dev = ["pytest>=8", "numpy>=1.26", "networkx>=3.4"]

[project.scripts]
qtbench-ai-judge = "qtbench.ai_judge:main"

[tool.uv]
build-constraint-dependencies = ["setuptools==83.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
